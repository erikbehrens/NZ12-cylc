meta=archive_and_meaning/postproc/postproc_2.5

[command]
default=main_pp.py nemo cice
pptransfer=transfer.py
verify=archive_integrity.py

[env]
CYCLEPERIOD=$CYCLEPERIOD
MEAN_NEMO_PATH=/data/users/moci/bin/MEAN_NEMO/moci_tr_r1648_cpe2305_cce15/mean_nemo.exe
OCEANDIR=/common/internal/ocean
REBUILD_NEMO_PATH=/data/users/moci/bin/REBUILD_NEMO/nemo_br_r10277_cpe2305_cce15/rebuild_nemo.exe
VERIFY_ENDDATE=$(rose date -c --calendar ${CYLC_CYCLING_MODE} --offset ${CYCLEPERIOD} -f %Y%m%d)

[file:atmospp.nl]
source=namelist:atmospp namelist:archiving namelist:delete_sc namelist:suitegen (namelist:moose_arch) (namelist:archer_arch)

[file:nemocicepp.nl]
source=namelist:nemo_pp namelist:nemo_processing namelist:nemo_archiving namelist:cice_pp namelist:cice_processing namelist:cice_archiving namelist:suitegen (namelist:moose_arch) (namelist:archer_arch)

[file:pptransfer.nl]
source=namelist:suitegen (namelist:pptransfer) (namelist:archer_arch)

[file:verify.nl]
source=namelist:commonverify (namelist:atmosverify) (namelist:ciceverify) (namelist:nemoverify)

[!!namelist:archer_arch]
archive_name=$CYLC_SUITE_NAME
archive_root_path=

[namelist:archiving]
!!arch_dump_freq=Monthly
!!arch_dump_offset=0
!!arch_timestamps=
!!arch_year_month=January
!!archive_dumps=true
!!archive_ncf=false
!!archive_pp=true
!!archive_switch=true

[namelist:atmospp]
!!archive_as_fieldsfiles=
!!convert_pp=false
!!convpp_all_streams=false
!!create_annual_mean=false
!!create_decadal_mean=false
create_means=false
!!create_monthly_mean=false
!!create_seasonal_mean=false
!!cutout_coords=1,1,192,145
!!cutout_coords_type=indices
!!fields_to_netcdf=
!!meanbase_period=
!!meanbase_stream=
!!netcdf_compression=0
!!netcdf_filetype=NETCDF4
!!ozone_fields=
!!ozone_output_stream=
!!ozone_source_stream=
pp_run=false
preserve_ozone=false
!!process_all_streams=false
!!process_means=
!!process_streams=a
pumf_path=/projects/um1/vn9.1/ibm/utilities/um-pumf
!!share_directory=$DATAM
!!streams_to_cutout=
!!streams_to_netcdf=
!!um_utils=

[namelist:atmosverify]
!!archive_timestamps=Monthly
!!delay_rst_archive=0m
!!ff_streams=
!!mean_reference_date=20001201
!!pp_climatemeans=false
!!streams_30d=
!!streams_90d=
!!timelimitedstreams=false
!!tlim_ends=
!!tlim_starts=
!!tlim_streams=
verify_model=false

[namelist:cice_archiving]
!!archive_means=true
!!archive_restart_buffer=1
!!archive_restart_timestamps=06-01,12-01
!!archive_restarts=true
!!means_to_archive=

[namelist:cice_pp]
pp_run=false
!!restart_directory=$CICE_DATA
!!work_directory=$CYLC_TASK_WORK_DIR/../ocean_ice

[namelist:cice_processing]
!!base_component=1m
!!cat_daily_means=false
!!chunking_arguments=time/1,nc/1,ni/288,nj/204
!!compress_netcdf=nccopy
!!compression_level=3
!!correct_time_bounds_variables=true
!!correct_time_variables=true
!!create_annual_mean=true
!!create_decadal_mean=false
!!create_means=true
!!create_monthly_mean=true
!!create_seasonal_mean=true
!!means_cmd=/projects/ocean/hadgem3/nco/nco-default/bin/ncra --64bit -O
!!time_vars=time

[namelist:ciceverify]
!!archive_timestamps=Biannual
!!buffer_restart=1
!!cice_age=false
!!mean_reference_date=1201
!!meanstreams=1m,1s,1y,
!!restart_suffix=.nc
verify_model=false

[namelist:commonverify]
check_additional_files_archived=true
dataset=moose:crum/${ARCHIVE_SET}
enddate=${VERIFY_ENDDATE}
prefix=$PREFIX
startdate=${CYLC_SUITE_INITIAL_CYCLE_POINT}

[namelist:delete_sc]
!!del_switch=true
!!gcmdel=true
!!gpdel=true
!!ncdel=true

[namelist:moose_arch]
archive_set=${ARCHIVE_SET}
non_duplexed_set=true

[namelist:nemo_archiving]
archive_iceberg_trajectory=true
archive_means=true
archive_restart_buffer=0
archive_restart_timestamps=06-01,12-01
archive_restarts=true
means_to_archive=1d

[namelist:nemo_pp]
pp_run=true
process_all_fieldsfiles=true
restart_directory=$NEMO_DATA
work_directory=$CYLC_TASK_WORK_DIR/../ocean_ice

[namelist:nemo_processing]
base_component=1m
chunking_arguments=time_counter/1,y/100,x/100
compress_netcdf=nccopy
compression_level=1
correct_time_bounds_variables=true
correct_time_variables=true
create_annual_mean=true
create_means=true
create_monthly_mean=true
create_seasonal_mean=true
exec_rebuild=${REBUILD_NEMO_PATH}
extract_region=false
means_cmd=${MEAN_NEMO_PATH}
!!means_fieldsfiles=
msk_rebuild=true
ncatted_cmd=${OCEANDIR}/hadgem3/nco/nco-4.4.7/bin/ncatted
!!rebu_cache=0
rebuild_compress=false
rebuild_mean_buffer=0
rebuild_restart_buffer=1
rebuild_restart_timestamps=06-01,12-01
!!region_chunking_args=time_counter/1,y/191,x/144
!!region_dimensions=x,1055,1198,y,850,1040
!!tchunk=0
time_vars=time_centered
!!xchunk=0
!!ychunk=0
!!zchunk=0

[namelist:nemoverify]
!!archive_timestamps=Biannual
!!buffer_mean=0
!!buffer_restart=1
!!iberg_traj=true
!!iberg_traj_freq=
!!iberg_traj_ts_per_day=
!!iberg_traj_tstamp=Timestep
!!mean_reference_date=1201
!!meanfields=grid-T,grid-U,grid-V,grid-W
!!meanstreams=1m,1s,1y,1d
!!nemo_icebergs_rst=true
!!nemo_ptracer_rst=false
verify_model=false

[!!namelist:pptransfer]
!!gridftp=false
remote_host=
transfer_dir=
transfer_type=Push
verify_chksums=true

[namelist:suitegen]
archive_command=Moose
archive_toplevel=true
calendar=$CALENDAR
mean_reference_date=0,12,1
nccopy_path=
ncdump_path=
ncks_path=
ncrcat_path=${OCEANDIR}/nemo/nco//nco-4.4.7/bin/
prefix=$PREFIX
process_toplevel=true
tasks_per_cycle=1
umtask_name=coupled
