[env]
DIAGNOSTICS=CMIP6
DIAG_XML_DIR=$CYLC_WORKFLOW_SHARE_DIR/fcm_make_ocean/extract/nemo/cfgs/METO_GO/EXPREF

[file:field_def_nemo-oce.xml]
mode=symlink
source=$CYLC_WORKFLOW_SHARE_DIR/fcm_make_ocean/extract/nemo/cfgs/SHARED/field_def_nemo-oce-CMIP6.xml

[file:file_def_nemo-oce-CMIP6.xml]
mode=symlink
source=$DIAG_XML_DIR/file_def_nemo-oce-CMIP6-$DIAG_MEAN_PERIOD.xml

[file:grid_def_nemo.xml]
mode=symlink
source=$CYLC_WORKFLOW_SHARE_DIR/fcm_make_ocean/extract/nemo/cfgs/SHARED/grid_def_nemo_404.xml

[file:context_nemo.xml]
mode=symlink
source=$DIAG_XML_DIR/context_nemo-CMIP6.xml

[file:domain_def_nemo.xml]
mode=symlink
source=$CYLC_WORKFLOW_SHARE_DIR/fcm_make_ocean/extract/nemo/cfgs/SHARED/domain_def_nemo_extract.xml

[namelist:namtrd]
ln_tra_trd=.true.

[namelist:namptr]
ln_diaptr=.true.
ln_subbas=.true.

[namelist:namtra_eiv]
ln_ldfeiv_dia=.true.

