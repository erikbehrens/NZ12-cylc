    =     the domain into equal horizontal domains. This means that if you request too many XIOS
    =     processors, the first processor will be entirely over land and will never receive any
    =     communication from NEMO causing the job step to hang at the end. For other grids you
    =     can estimate the number of XIOS processors by ensuring that the number of j points in
    =     the grid divided by the number of XIOS cores is greater than the j index of the most
    =     southerly grid point.
    =   - Take a wild guess at the number of NEMO cores required (NEMO_NPROC) or have a look at
