[template variables=NEMO_LAND_SUPPRESS]
compulsory=true
description=Activate land suppression in NEMO. Please read help page
help=Running with land suppression means that NEMO
    = means that any MPI domains that are entirely over land do not
    = require a core on the HPC. This can provide very large savings i
    = in computing resource.
    =
    = To activate land suppression:
    =   - Set the number of XIOS processors to 6 (for extended ORCA025 with no icesheets). XIOS divides
    =     the domain into equal horizontal domains. This means that if you request too many XIOS
    =     processors, the first processor will be entirely over land and will never receive any
    =     communication from NEMO causing the job step to hang at the end. For other grids you
    =     can estimate the number of XIOS processors by ensuring that the number of j points in
    =     the grid divided by the number of XIOS cores is greater than the j index of the most
    =     southerly grid point.
    =   - Take a wild guess at the number of NEMO cores required (NEMO_NPROC) or have a look at
    =     http://collab.metoffice.gov.uk/twiki/bin/view/Project/UKNEMO/NEMOLandSuppressionNumbers
    =     to see if anyone has worked it out for you.
    =   - Recompile and run your first job step. Unless you were very lucky with your guess above
    =     the model will fail so you may want to set a short wall clock time for this bit.
    =   - When the model fails have a look in the ocean.output file in the run directory and search
    =     for "E R R O R". You should find an error message telling you that you set jpnij to the
    =     wrong value. Helpfully it will tell you what the correct value should be.
    =   - Set NEMO_NPROC to the correct value.
    =   - Recompile and run the model as normal.
    =
ns=Processor decomposition
sort-key=2c
title=NEMO: Use land suppression
trigger=template variables=NEMO_NPROC: true ;
type=boolean

